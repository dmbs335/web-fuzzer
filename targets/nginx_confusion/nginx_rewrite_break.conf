worker_processes 1;
events { worker_connections 64; }

http {
    server {
        listen 80;
        server_name localhost;

        # Public area — anyone can access
        location /safe {
            rewrite ^/safe(.*)$ /admin$1 break;
            proxy_pass http://backend:80;
        }

        # Admin — denied
        location /admin {
            deny all;
            return 403;
        }

        # Backend direct (for comparison)
        location /direct {
            proxy_pass http://backend:80;
        }

        location /health {
            return 200 "ok";
        }
    }
}
