# Apache Confusion Differential Fuzzing — Multi-config containers
#
# Each service runs Apache 2.4 + mod_fuzztrace with a different config.
# Primary target = config_00 (baseline), references = config_01..12.
#
# Usage:
#   docker compose build
#   docker compose up -d
#   curl -v http://localhost:9100/health   # baseline
#   curl -v http://localhost:9101/..;/admin/  # rewrite+proxy

x-common: &common
  build:
    context: .
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:80/health"]
    interval: 5s
    timeout: 3s
    retries: 3

services:
  config_00:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/00_baseline.conf
    ports: ["9100:80"]

  config_01:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/01_rewrite_proxy.conf
    ports: ["9101:80"]

  config_02:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/02_rewrite_cgi.conf
    ports: ["9102:80"]

  config_03:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/03_perdir_proxy_files.conf
    ports: ["9103:80"]

  config_04:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/04_proxy_ajp_location.conf
    ports: ["9104:80"]

  config_05:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/05_perdir_static_directory.conf
    ports: ["9105:80"]

  config_06:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/06_negotiation.conf
    ports: ["9106:80"]

  config_07:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/07_rewrite_proxy_directory.conf
    ports: ["9107:80"]

  config_08:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/08_proxy_noauth.conf
    ports: ["9108:80"]

  config_09:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/09_perdir_cgi_location.conf
    ports: ["9109:80"]

  config_10:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/10_negotiation_files.conf
    ports: ["9110:80"]

  config_11:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/11_proxy_ajp_directory.conf
    ports: ["9111:80"]

  config_12:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/12_htaccess_override.conf
    ports: ["9112:80"]

  config_13:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/13_perdir_rewrite_to_denied.conf
    ports: ["9113:80"]

  config_14:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/14_multiviews_files.conf
    ports: ["9114:80"]

  config_15:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/15_proxy_directory_authz.conf
    ports: ["9115:80"]

  config_16:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/16_if_expr_uri.conf
    ports: ["9116:80"]

  config_17:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/17_action_cgi_reroute.conf
    ports: ["9117:80"]

  config_18:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/18_alias_script_directory.conf
    ports: ["9118:80"]

  config_19:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/19_require_env_rewrite.conf
    ports: ["9119:80"]

  # Under-audited modules
  config_20:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/20_dav_propfind.conf
    ports: ["9120:80"]

  config_21:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/21_cache_quickhandler.conf
    ports: ["9121:80"]

  config_22:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/22_limit_method.conf
    ports: ["9122:80"]

  # ── Backend server (no ACL, serves everything) ──
  backend:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/backend.conf
    # No host port — only accessible from docker network

  # Reverse proxy to separate backend + Directory authz
  config_23:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/23_proxy_backend_directory.conf
    ports: ["9123:80"]
    depends_on:
      - backend

  # Reverse proxy to separate backend + Location authz (control)
  config_24:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/24_proxy_backend_location.conf
    ports: ["9124:80"]
    depends_on:
      - backend

  # ── Version-differential: same config, different Apache versions ──
  # Orange CVE patches landed in Apache 2.4.60 (July 2024).
  # 2.4.58 = pre-patch, 2.4.62 = post-patch.

  # Proxy [P] + Directory authz on Apache 2.4.58 (pre-patch)
  ver_258_proxy_dir:
    <<: *common
    build:
      context: .
      args:
        HTTPD_TAG: "2.4.58"
        CONFIG_FILE: configs/15_proxy_directory_authz.conf
    ports: ["9200:80"]

  # Same config on Apache 2.4.62 (post-patch)
  ver_262_proxy_dir:
    <<: *common
    build:
      context: .
      args:
        HTTPD_TAG: "2.4.62"
        CONFIG_FILE: configs/15_proxy_directory_authz.conf
    ports: ["9201:80"]

  # Per-dir rewrite TOCTOU on 2.4.58
  ver_258_perdir:
    <<: *common
    build:
      context: .
      args:
        HTTPD_TAG: "2.4.58"
        CONFIG_FILE: configs/13_perdir_rewrite_to_denied.conf
    ports: ["9202:80"]

  # Same on 2.4.62
  ver_262_perdir:
    <<: *common
    build:
      context: .
      args:
        HTTPD_TAG: "2.4.62"
        CONFIG_FILE: configs/13_perdir_rewrite_to_denied.conf
    ports: ["9203:80"]

  # Expr TOCTOU on 2.4.58
  ver_258_expr:
    <<: *common
    build:
      context: .
      args:
        HTTPD_TAG: "2.4.58"
        CONFIG_FILE: configs/16_if_expr_uri.conf
    ports: ["9204:80"]

  # Same on 2.4.62
  ver_262_expr:
    <<: *common
    build:
      context: .
      args:
        HTTPD_TAG: "2.4.62"
        CONFIG_FILE: configs/16_if_expr_uri.conf
    ports: ["9205:80"]

  # 2.4.58 proxy to separate backend + Directory authz
  ver_258_backend_dir:
    <<: *common
    build:
      context: .
      args:
        HTTPD_TAG: "2.4.58"
        CONFIG_FILE: configs/23_proxy_backend_directory.conf
    ports: ["9210:80"]
    depends_on:
      - backend

  # CANDIDATE 1: PT extension confusion (mod_rewrite PT → mod_mime)
  config_25:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/25_pt_extension_confusion.conf
    ports: ["9125:80"]

  # CANDIDATE 6: Forced handler via [H=] flag
  config_26:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/26_forced_handler_rewrite.conf
    ports: ["9126:80"]

  # CANDIDATE 7: SetHandler expr= dynamic evaluation
  config_27:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/27_sethandler_expr.conf
    ports: ["9127:80"]

  # CANDIDATE 4: proxy_fcgi URI swap TOCTOU
  config_28:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/28_proxy_fcgi_uri_swap.conf
    ports: ["9128:80"]

  # SetHandler proxy: path injection test
  config_29:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/29_sethandler_proxy.conf
    ports: ["9129:80"]
    depends_on:
      - backend

  config_30:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/30_proxypass_comparison.conf
    ports: ["9130:80"]
    depends_on:
      - backend

  ver_258_sethandler:
    <<: *common
    build:
      context: .
      args:
        HTTPD_TAG: "2.4.58"
        CONFIG_FILE: configs/30_proxypass_comparison.conf
    ports: ["9211:80"]
    depends_on:
      - backend

  config_31:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/31_sethandler_exploit.conf
    ports: ["9131:80"]
    depends_on:
      - backend

  config_32:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/32_proxy_acl_confusion.conf
    ports: ["9132:80"]
    depends_on:
      - backend

  config_33:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/33_proxy_deny_all.conf
    ports: ["9133:80"]
    depends_on:
      - backend

  config_34:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/34_clean_proxy_acl.conf
    ports: ["9134:80"]
    depends_on:
      - backend

  config_35:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/35_proxy_acl_noport.conf
    ports: ["9135:80"]
    depends_on:
      - backend

  config_36:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/36_forward_proxy_deny.conf
    ports: ["9136:80"]
    depends_on:
      - backend

  config_37:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/37_cache_acl_bypass.conf
    ports: ["9137:80"]

  config_38:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/38_cache_acl_precise.conf
    ports: ["9138:80"]

  config_39:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/39_htaccess_unsafe.conf
    ports: ["9139:80"]

  config_40:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/40_forced_type_injection.conf
    ports: ["9140:80"]
    depends_on:
      - backend

  tomcat-ajp:
    image: tomcat:9-jdk11
    restart: unless-stopped
    environment:
      - CATALINA_OPTS=-Dajp.port=8009 -Dajp.address=0.0.0.0 -Dajp.secretRequired=false
    command: >
      bash -c "
        mkdir -p /usr/local/tomcat/webapps/ROOT /usr/local/tomcat/webapps/app &&
        echo '<html>Tomcat ROOT</html>' > /usr/local/tomcat/webapps/ROOT/index.html &&
        echo '<html>Tomcat APP</html>' > /usr/local/tomcat/webapps/app/index.html &&
        echo '<html>Tomcat APP secret</html>' > /usr/local/tomcat/webapps/app/secret.html &&
        sed -i 's/<!--.*<Connector protocol=\"AJP/<Connector protocol=\"AJP/' /usr/local/tomcat/conf/server.xml &&
        sed -i 's/port=\"8009\".*-->/port=\"8009\" address=\"0.0.0.0\" secretRequired=\"false\" \/>/' /usr/local/tomcat/conf/server.xml &&
        catalina.sh run
      "

  config_41:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/41_ajp_sethandler.conf
    ports: ["9141:80"]
    depends_on:
      - backend
      - tomcat-ajp

  scgi-backend:
    image: python:3.10-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../targets/apache_confusion/scgi_backend.py:/app/scgi_backend.py
    environment:
      - REDIRECT_TARGET=/server-status
    command: python scgi_backend.py

  config_42:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/42_scgi_redirect.conf
    ports: ["9142:80"]
    depends_on:
      - scgi-backend

  # CVE reproductions on Apache 2.4.58 (pre-patch)
  cve_38474:
    <<: *common
    build:
      context: .
      args:
        HTTPD_TAG: "2.4.58"
        CONFIG_FILE: configs/cve_38474_truncation.conf
    ports: ["9300:80"]

  cve_38475:
    <<: *common
    build:
      context: .
      args:
        HTTPD_TAG: "2.4.58"
        CONFIG_FILE: configs/cve_38475_docroot.conf
    ports: ["9301:80"]

  cve_39573:
    <<: *common
    build:
      context: .
      args:
        HTTPD_TAG: "2.4.58"
        CONFIG_FILE: configs/cve_39573_prefix.conf
    ports: ["9302:80"]

  cve_38473:
    <<: *common
    build:
      context: .
      args:
        HTTPD_TAG: "2.4.58"
        CONFIG_FILE: configs/cve_38473_sethandler.conf
    ports: ["9303:80"]
    depends_on:
      - backend

  cve_38475_real:
    <<: *common
    build:
      context: .
      args:
        HTTPD_TAG: "2.4.58"
        CONFIG_FILE: configs/cve_38475_realistic.conf
    ports: ["9304:80"]

  cve_38476:
    <<: *common
    build:
      context: .
      args:
        HTTPD_TAG: "2.4.58"
        CONFIG_FILE: configs/cve_38476_handler.conf
    ports: ["9305:80"]

  cve_38477:
    <<: *common
    build:
      context: .
      args:
        HTTPD_TAG: "2.4.58"
        CONFIG_FILE: configs/cve_38477_dos.conf
    ports: ["9306:80"]

  novel_1:
    <<: *common
    build:
      context: .
      args:
        HTTPD_TAG: "2.4.58"
        CONFIG_FILE: configs/novel_args_proxy.conf
    ports: ["9400:80"]
    depends_on:
      - backend

  novel_1_patched:
    <<: *common
    build:
      context: .
      args:
        CONFIG_FILE: configs/novel_args_proxy.conf
    ports: ["9401:80"]
    depends_on:
      - backend
