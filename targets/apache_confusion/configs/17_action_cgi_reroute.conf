# Config 17: mod_actions rerouting in fixup phase — handler confusion
#
# Action directive runs in fixup phase and reroutes requests based on
# handler name or content-type to a CGI script. The access_checker runs
# against the ORIGINAL filename, but the CGI script receives PATH_INFO
# pointing to the original resource — potentially in a denied directory.
#
# This is in mod_actions.c, completely separate from Orange's patches.

LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule actions_module modules/mod_actions.so

ServerName localhost

ScriptAlias /cgi-bin/ /usr/local/apache2/htdocs/cgi-bin/

# Action: reroute all text/html requests to a CGI handler
# The CGI script receives PATH_INFO = original path, PATH_TRANSLATED = original file
Action text/html /cgi-bin/test.cgi

<Directory /usr/local/apache2/htdocs>
    Options +ExecCGI
    Require all granted
</Directory>

<Location />
    Require all granted
</Location>

<Location /admin>
    Require all denied
</Location>

<Location /internal>
    Require all denied
</Location>
