# Config 07: Simple rewrite + proxy + Directory authz + mod_autoindex
# Dimensions: rewrite=simple, backend=proxy_http, authz=directory, path_norm=default, extra=mod_autoindex
# Tests: autoindex interaction with directory-based auth

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost

Options +Indexes

RewriteEngine On
RewriteRule ^/api/(.*)$ http://127.0.0.1:80/public/$1 [P]

<Directory /usr/local/apache2/htdocs/admin>
    Require all denied
</Directory>

<Directory /usr/local/apache2/htdocs/internal>
    Require all denied
</Directory>

<Directory /usr/local/apache2/htdocs>
    Require all granted
</Directory>
