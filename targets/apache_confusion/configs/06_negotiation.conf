# Config 06: mod_negotiation + static + Location authz
# Dimensions: rewrite=off, backend=static, authz=location, path_norm=default, extra=mod_negotiation
# Tests: content negotiation changing handler/filename after access check

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost

Options +MultiViews

<Location />
    Require all granted
</Location>

<Location /admin>
    Require all denied
</Location>

<Location /internal>
    Require all denied
</Location>

<Location /health>
    Require all granted
</Location>


