# CANDIDATE 6: mod_rewrite forced handler via [H=] flag
# mod_rewrite.c:5681 (hook_mimetype, FIXUP_LAST) → config.c:440 (invoke handler)
# Access control permits static file. [H=] changes handler to cgi-script at FIXUP_LAST.

LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule cgi_module modules/mod_cgi.so

ServerName localhost

<Location />
    Require all granted
</Location>

<Location /admin>
    Require all denied
</Location>

# CGI dir
<Location /cgi-bin>
    Require all granted
    Options +ExecCGI
</Location>

RewriteEngine On

# [H=] flag forces handler AFTER access check
# .txt file allowed as static → [H=cgi-script] forces CGI execution
RewriteRule ^/public/(.+)\.txt$ - [H=cgi-script,L]

# Force server-status handler on public path
RewriteRule ^/public/status$ - [H=server-status,L]

<Directory "/usr/local/apache2/htdocs/public">
    Options +ExecCGI
</Directory>

<Location /health>
    Require all granted
</Location>

<Location /fuzztrace>
    Require all granted
</Location>
