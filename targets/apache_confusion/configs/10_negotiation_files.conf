# Config 10: mod_negotiation + static + Files authz + MergeSlashes off
# Dimensions: rewrite=simple, backend=static, authz=files, path_norm=merge_slashes_off, extra=mod_negotiation
# Tests: MultiViews + Files-based restrictions with merge slashes disabled

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost
MergeSlashes Off

Options +MultiViews

RewriteEngine On
RewriteRule ^/view/(.*)$ /$1 [L]

<Files "secret.html">
    Require all denied
</Files>

<Files "config.html">
    Require all denied
</Files>

<Location />
    Require all granted
</Location>
