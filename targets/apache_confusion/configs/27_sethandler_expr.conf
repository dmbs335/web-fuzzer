# CANDIDATE 7: SetHandler expr= dynamic evaluation
# core.c:5117 (core_override_type, FIXUP_REALLY_FIRST)
# Attacker controls env var via query string → controls handler selection

LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule cgi_module modules/mod_cgi.so

ServerName localhost

<Location />
    Require all granted
</Location>

<Location /admin>
    Require all denied
</Location>

RewriteEngine On

# Set environment variable from query string
RewriteCond %{QUERY_STRING} handler=([a-z-]+)
RewriteRule .* - [E=USER_HANDLER:%1]

# Also set from header
RewriteCond %{HTTP:X-Handler} ^([a-z-]+)$
RewriteRule .* - [E=USER_HANDLER:%1]

# SetHandler with expr — evaluates AFTER access check
<Directory "/usr/local/apache2/htdocs/public">
    SetHandler "expr=%{reqenv:USER_HANDLER}"
    Options +ExecCGI
</Directory>

<Location /health>
    Require all granted
</Location>

<Location /fuzztrace>
    Require all granted
</Location>
