# Config 05: Per-dir rewrite + static + Directory authz + AllowEncodedSlashes
# Dimensions: rewrite=per_dir, backend=static, authz=directory, path_norm=allow_encoded
#
# Key confusion surface:
# - Per-dir rewrite runs in fixup (AFTER initial access_checker)
# - Directory-based authz relies on filesystem path mapping
# - AllowEncodedSlashes On may let encoded paths bypass Directory matching
# - Rewrite maps /app/* → local resolution (not admin→public swap)

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost
AllowEncodedSlashes On

<Directory /usr/local/apache2/htdocs>
    RewriteEngine On
    # Map /app/* to root — no cross-directory substitution
    RewriteRule ^app/(.*)$ /$1 [L]

    Options +FollowSymLinks
    Require all granted
</Directory>

<Directory /usr/local/apache2/htdocs/admin>
    Require all denied
</Directory>

<Directory /usr/local/apache2/htdocs/internal>
    Require all denied
</Directory>
