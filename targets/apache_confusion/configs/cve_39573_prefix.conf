LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ServerName localhost

<Location />
    Require all granted
</Location>

RewriteEngine On
# Orange's example: broken prefix rewrite
RewriteRule "^/broken(.*)$" "$1" [L]

<Location /health>
    Require all granted
</Location>
<Location /fuzztrace>
    Require all granted
</Location>
