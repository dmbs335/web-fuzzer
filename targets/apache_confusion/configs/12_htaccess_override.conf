# Config 12: .htaccess override enabled + static + Location authz
# Dimensions: rewrite=off, backend=static, authz=location, path_norm=default, extra=AllowOverride
# Tests: .htaccess overriding server-level access controls

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost

<Location /admin>
    Require all denied
</Location>

<Location /internal>
    Require all denied
</Location>

<Directory /usr/local/apache2/htdocs>
    AllowOverride All
    Require all granted
</Directory>
