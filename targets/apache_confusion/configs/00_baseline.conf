# Config 00: Baseline — static files, Location-based authz, no rewrite
# Dimensions: rewrite=off, backend=static, authz=location, path_norm=default
#
# FP fix: <Location /> must come FIRST so more-specific sections override.
# Apache merges Location containers in order of specificity, but when
# multiple match, the LAST matching Require directive wins.

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost

# Base: allow everything, then deny specific paths.
# Apache 2.4 evaluates Location from least to most specific.
<Location />
    Require all granted
</Location>

<Location /admin>
    Require all denied
</Location>

<Location /internal>
    Require all denied
</Location>
