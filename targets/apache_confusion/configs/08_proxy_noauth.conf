# Config 08: Proxy passthrough + no authz (permissive baseline)
# Dimensions: rewrite=proxy_passthrough, backend=proxy_http, authz=none, path_norm=default
# Tests: no access control — what does the proxy actually resolve?

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost

RewriteEngine On
RewriteRule ^/proxy/(.*)$ http://127.0.0.1:80/$1 [P]

# No access restrictions — everything allowed
<Location />
    Require all granted
</Location>
