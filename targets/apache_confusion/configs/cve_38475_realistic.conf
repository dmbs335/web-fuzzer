LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule rewrite_module modules/mod_rewrite.so

ServerName localhost

# NO <Location /> Require all granted
# Base httpd.conf already has:
#   <Directory /> Require all denied
#   <Directory /usr/local/apache2/htdocs> Require all granted

RewriteEngine On
RewriteRule "^/files/(.*)$" "/$1" [L]

<Location /health>
    Require all granted
</Location>
<Location /fuzztrace>
    Require all granted
</Location>
