# Config 20: mod_dav PROPFIND/COPY — WebDAV cross-directory access
#
# PROPFIND with Depth:infinity may enumerate denied directory contents.
# COPY/MOVE with Destination header may write to denied directories.
# access_checker runs against request URI but not Destination header.

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost

DavLockDB /var/lock/apache2/dav/lock

<Location />
    Require all granted
</Location>

<Location /admin>
    Require all denied
</Location>

<Location /internal>
    Require all denied
</Location>

<Location /dav>
    Dav On
    Require all granted
</Location>
