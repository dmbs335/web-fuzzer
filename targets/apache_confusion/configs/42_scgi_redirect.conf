LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_scgi_module modules/mod_proxy_scgi.so
LoadModule status_module modules/mod_status.so

ServerName localhost

<Location />
    Require all granted
</Location>

# SCGI backend proxy
ProxyPass /scgi scgi://scgi-backend:4000

# server-status: restricted to localhost only
<Location /server-status>
    SetHandler server-status
    Require local
</Location>

# Admin: denied
<Location /admin>
    Require all denied
</Location>

<Location /health>
    Require all granted
</Location>
<Location /fuzztrace>
    Require all granted
</Location>
