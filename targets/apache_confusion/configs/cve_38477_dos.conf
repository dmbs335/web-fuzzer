LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ServerName localhost

# Forward proxy enabled — CVE-2024-38477 requires this
ProxyRequests On

<Proxy *>
    Require all granted
</Proxy>

<Location />
    Require all granted
</Location>

<Location /health>
    Require all granted
</Location>
<Location /fuzztrace>
    Require all granted
</Location>
