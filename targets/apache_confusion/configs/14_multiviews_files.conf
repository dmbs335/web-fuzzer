# Config 14: MultiViews + Files authz — extensionless bypass surface
#
# Attack Surface #3 from Red Team:
# mod_negotiation with MultiViews runs in type_checker (AFTER access_checker).
# <Files "secret.html"> matches basename at access_check.
# Request "/secret" (no extension) → access_check: "secret" ≠ "secret.html" → PASS
# → type_checker: mod_negotiation resolves "secret" → "secret.html" → served
#
# Trivial bypass: request the resource WITHOUT its extension.

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost

Options +MultiViews

<Location />
    Require all granted
</Location>

<Files "secret.html">
    Require all denied
</Files>

<Files "config.html">
    Require all denied
</Files>
