# Clean test: <Proxy> ACL WITHOUT port (to match canonicalized URL)

LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ServerName localhost

<Location />
    Require all granted
</Location>

# ProxyPass to backend
ProxyPass /blocked-pp http://backend:80/api
ProxyPass /allowed-pp http://backend:80/public

# <Proxy> ACL WITHOUT port — should match canonicalized URL
<Proxy http://backend/api/*>
    Require all denied
</Proxy>

<Proxy http://backend/public/*>
    Require all granted
</Proxy>

# SetHandler versions
<Location /blocked-sh>
    SetHandler "proxy:http://backend:80/api"
</Location>

<Location /allowed-sh>
    SetHandler "proxy:http://backend:80/public"
</Location>

<Location /health>
    Require all granted
</Location>
<Location /fuzztrace>
    Require all granted
</Location>
