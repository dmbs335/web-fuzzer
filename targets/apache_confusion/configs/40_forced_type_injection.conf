LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ServerName localhost

<Location />
    Require all granted
</Location>

<Location /admin>
    Require all denied
</Location>

# Realistic config: admin wants to forward client's Content-Type to the response
# or use it for content negotiation
RewriteEngine On
RewriteRule ^/typed/(.*)$ /$1 [T=%{HTTP:X-Content-Type},L]

<Location /health>
    Require all granted
</Location>
<Location /fuzztrace>
    Require all granted
</Location>
