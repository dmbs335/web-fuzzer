# Config 19: Require env + RewriteRule [E=] — env var injection authz bypass
#
# RewriteRule with [E=VAR:VALUE] flag sets environment variables.
# Require env VAR grants access if the env var is set.
# If the attacker can trigger a RewriteRule that sets the env var,
# they control authorization — the rewrite pattern match becomes
# the de facto ACL.
#
# This tests a completely different shared state dimension:
# r->subprocess_env (environment variables) instead of r->filename.

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost
AllowEncodedSlashes On

RewriteEngine On

# Rewrite sets INTERNAL_OK env var for requests matching /api/*
# Intent: only /api/* paths should get the env var
RewriteRule ^/api/ - [E=INTERNAL_OK:1]

# Also set for specific query params (simulates real-world pattern)
RewriteCond %{QUERY_STRING} ^token=
RewriteRule .* - [E=INTERNAL_OK:1]

<Location />
    Require all granted
</Location>

# Admin protected by env var — only accessible if INTERNAL_OK is set
# (simulates internal API gateway pattern)
<Location /admin>
    Require env INTERNAL_OK
</Location>

<Location /internal>
    Require env INTERNAL_OK
</Location>
