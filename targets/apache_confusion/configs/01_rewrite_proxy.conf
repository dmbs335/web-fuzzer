# Config 01: RewriteRule proxy passthrough — classic filename confusion
# Dimensions: rewrite=proxy_passthrough, backend=proxy_http, authz=location, path_norm=default
# Orange pattern: mod_rewrite sets r->filename to proxy URL, access check sees literal string

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost

RewriteEngine On

# Proxy passthrough: RewriteRule rewrites to proxy URL
# This causes filename confusion: r->filename becomes "proxy:http://..."
RewriteRule ^/proxy/(.*)$ http://127.0.0.1:80/public/$1 [P]

# Base grant, then specific deny (most-specific wins in Apache 2.4)
<Location />
    Require all granted
</Location>

<Location /admin>
    Require all denied
</Location>

<Location /internal>
    Require all denied
</Location>
