# Orange Principle Test: <Proxy> ACL vs SetHandler filesystem path confusion
#
# <Proxy> ACL expects URL path (/api/*)
# SetHandler sends filesystem path (/usr/local/apache2/htdocs/app)
# → ACL mismatch → potential bypass

LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ServerName localhost

<Location />
    Require all granted
</Location>

# Proxy ACL: deny access to backend /admin/*
<Proxy http://backend:80/admin/*>
    Require all denied
</Proxy>

# Only allow proxying to /api/*
<Proxy http://backend:80/api/*>
    Require all granted
</Proxy>

# Default deny all other proxy requests
<Proxy *>
    Require all denied
</Proxy>

# SetHandler proxy to backend
<Location /app>
    SetHandler "proxy:http://backend:80"
</Location>

# ProxyPass for comparison
ProxyPass /direct-api http://backend:80/api

<Location /admin>
    Require all denied
</Location>

<Location /health>
    Require all granted
</Location>

<Location /fuzztrace>
    Require all granted
</Location>
