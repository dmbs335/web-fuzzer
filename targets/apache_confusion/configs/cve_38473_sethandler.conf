LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ServerName localhost

<Location />
    Require all granted
</Location>

<Files "admin.php">
    Require all denied
</Files>

<FilesMatch ".+\.ph(ar|p|tml)$">
    SetHandler "proxy:http://backend:80"
</FilesMatch>

<Location /health>
    Require all granted
</Location>
<Location /fuzztrace>
    Require all granted
</Location>
