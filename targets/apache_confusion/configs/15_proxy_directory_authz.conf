# Config 15: RewriteRule [P] + <Directory> authz — Orange's CVE pattern
#
# Attack Surface #1 from Red Team:
# mod_rewrite with [P] sets r->filename to "proxy:http://backend/..."
# <Directory> ACL runs against r->filename expecting filesystem path.
# "proxy:http://..." does NOT match <Directory /htdocs/admin>.
# mod_proxy then forwards to backend serving protected content.
#
# The proxy target is the SAME server to keep setup simple,
# but routes through /proxy/ to reach /admin/ content.

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost

RewriteEngine On
# Proxy to self — maps /gateway/* to the same server's root
RewriteRule ^/gateway/(.*)$ http://127.0.0.1:80/$1 [P]

# Directory-based authz (NOT Location-based)
# This is the critical difference from config 01 (which uses Location)
<Directory /usr/local/apache2/htdocs/admin>
    Require all denied
</Directory>

<Directory /usr/local/apache2/htdocs/internal>
    Require all denied
</Directory>

<Directory /usr/local/apache2/htdocs>
    Require all granted
</Directory>
