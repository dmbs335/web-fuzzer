# Config 22: <LimitExcept> method-based ACL — HTTP method confusion
#
# <LimitExcept GET POST> applies authz only to methods NOT listed.
# Fabricated methods, case variants, or HEAD (internally converted to GET)
# may slip through the method matching logic.
#
# ap_method_in_list() in Apache uses case-sensitive comparison.

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost

<Location />
    Require all granted
</Location>

<Location /admin>
    <LimitExcept GET POST HEAD>
        Require all denied
    </LimitExcept>
</Location>

<Location /internal>
    Require all denied
</Location>
