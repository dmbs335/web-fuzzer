# Config 09: Per-dir rewrite + CGI + Location authz + AllowEncodedSlashes
# Dimensions: rewrite=per_dir, backend=cgi, authz=location, path_norm=allow_encoded
# Tests: per-dir rewrite in fixup phase interacting with Location-based ACL

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost
AllowEncodedSlashes On

ScriptAlias /cgi-bin/ /usr/local/apache2/htdocs/cgi-bin/

<Directory /usr/local/apache2/htdocs>
    RewriteEngine On
    RewriteRule ^cgi/(.*)$ /cgi-bin/test.cgi/$1 [L]

    Options +ExecCGI
    Require all granted
</Directory>

<Location /admin>
    Require all denied
</Location>

<Location /internal>
    Require all denied
</Location>
