# Config 03: Per-directory rewrite + proxy + Files-based authz + AllowEncodedSlashes
# Dimensions: rewrite=per_dir, backend=proxy_http, authz=files, path_norm=allow_encoded
#
# Key confusion surface:
# - AllowEncodedSlashes On lets encoded path chars through
# - Per-dir rewrite runs in fixup (AFTER access_checker)
# - <Files> matches basename only, not full path
# - NO admin→public rewrite — admin content is served directly
#   so any bypass leaks actual protected content

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost
AllowEncodedSlashes On

<Directory /usr/local/apache2/htdocs>
    RewriteEngine On
    # Per-dir rewrite: runs in fixup phase, AFTER access check
    # Map /app/* to local files (no proxy, no content substitution)
    RewriteRule ^app/(.*)$ /$1 [L]

    Options +FollowSymLinks
    Require all granted
</Directory>

# Protect sensitive files by name (basename matching only)
<Files "secret.html">
    Require all denied
</Files>

<Files "config.html">
    Require all denied
</Files>

<Files ".htaccess">
    Require all denied
</Files>

# Also deny the admin directory via Files pattern
<FilesMatch "^\.ht">
    Require all denied
</FilesMatch>
