# CANDIDATE 4: mod_proxy_fcgi URI swap TOCTOU
# mod_proxy_fcgi.c:378 (fixups, swaps r->uri) → core dir_walk
# proxy_fcgi_fixups temporarily changes r->uri during fixups

LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so

ServerName localhost

<Location />
    Require all granted
</Location>

<Location /admin>
    Require all denied
</Location>

# PHP via FCGI — proxy_fcgi_fixups will swap r->uri
<Directory "/usr/local/apache2/htdocs/app">
    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>
</Directory>

RewriteEngine On

# Per-dir rewrite in fixup phase — runs same phase as proxy_fcgi_fixups
<Directory "/usr/local/apache2/htdocs/app">
    RewriteRule ^(.*)\.phps$ $1.php [L]
</Directory>

<Location /health>
    Require all granted
</Location>

<Location /fuzztrace>
    Require all granted
</Location>
