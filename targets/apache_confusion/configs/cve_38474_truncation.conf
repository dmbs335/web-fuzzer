LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule rewrite_module modules/mod_rewrite.so

ServerName localhost

<Location />
    Require all granted
</Location>

# Orange's example: RewriteRule maps user profile
RewriteEngine On
RewriteRule "^/user/(.+)$" "/var/user/$1/profile.yml" [L]

# Also test ACL bypass variant
<Files "admin.php">
    Require all denied
</Files>

<Location /health>
    Require all granted
</Location>
<Location /fuzztrace>
    Require all granted
</Location>
