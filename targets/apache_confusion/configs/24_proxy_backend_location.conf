# Config 24: Reverse proxy to SEPARATE backend + Location authz
#
# Same as config 23 but with <Location> authz (should be safer).
# This is the control config — Location matches against r->uri
# which is NOT affected by proxy filename confusion.

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost

RewriteEngine On
RewriteRule ^/proxy/(.*)$ http://backend:80/$1 [P]

<Location />
    Require all granted
</Location>

<Location /admin>
    Require all denied
</Location>

<Location /internal>
    Require all denied
</Location>
