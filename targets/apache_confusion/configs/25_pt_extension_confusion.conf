# CANDIDATE 1: PassThrough [PT] + mod_mime extension confusion
# mod_rewrite.c:5554 (passthrough strip) → mod_mime.c:970 (handler by ext)
# Access control sees .secret extension → denied. PT rewrites to .html → served.

LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule mime_module modules/mod_mime.so

ServerName localhost

AddType text/html .html .htm
AddHandler default-handler .html

<Location />
    Require all granted
</Location>

# Deny all .secret files
<FilesMatch "\.secret$">
    Require all denied
</FilesMatch>

# Deny /admin/
<Location /admin>
    Require all denied
</Location>

RewriteEngine On

# PT flag: rewrite .secret to .html, passthrough to next handler
RewriteRule ^/docs/(.+)\.secret$ /public/$1.html [PT,L]

# Another PT variant: rewrite admin path to public
RewriteRule ^/bypass/(.*)$ /public/$1 [PT,L]

<Location /health>
    Require all granted
</Location>

<Location /fuzztrace>
    Require all granted
</Location>
