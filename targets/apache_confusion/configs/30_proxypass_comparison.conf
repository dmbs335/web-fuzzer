# Control config: ProxyPass (standard) vs SetHandler proxy: comparison
# Same intent, different mechanism

LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ServerName localhost

<Location />
    Require all granted
</Location>

<Location /admin>
    Require all denied
</Location>

# ProxyPass — the "correct" way
ProxyPass /pp-api http://backend:80/api
ProxyPassReverse /pp-api http://backend:80/api

# SetHandler — the "alternative" way (same intent)
<Location /sh-api>
    SetHandler "proxy:http://backend:80/api"
</Location>

<Location /health>
    Require all granted
</Location>

<Location /fuzztrace>
    Require all granted
</Location>
