# Orange Principle 3: Access Control Decoupling via mod_cache quick_handler
#
# mod_cache quick_handler runs BEFORE access_check
# If cache hit → response served without ACL evaluation
# Test: IP-based ACL + CacheQuickHandler On (default)

LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule cache_module modules/mod_cache.so
LoadModule cache_socache_module modules/mod_cache_socache.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

ServerName localhost

# Enable shared memory cache
CacheSocache shmcb
CacheEnable socache /

# CacheQuickHandler is ON by default — we leave it as default
# CacheQuickHandler On

# Public area — anyone can access
<Location />
    Require all granted
</Location>

# Admin — IP-based ACL (no Authorization header involved)
<Location /admin>
    Require ip 172.18.0.0/16
</Location>

# Secret — more restrictive
<Location /secret>
    Require ip 127.0.0.1
</Location>

<Location /health>
    Require all granted
</Location>

<Location /fuzztrace>
    Require all granted
</Location>
