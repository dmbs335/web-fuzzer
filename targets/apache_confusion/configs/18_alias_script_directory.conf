# Config 18: ScriptAlias + Directory authz — translate_name confusion
#
# ScriptAlias maps a URL prefix to a filesystem path AND assigns
# the cgi-script handler, all in translate_name phase. The Directory
# authz runs against the RESOLVED filesystem path. If ScriptAlias
# maps to a path that crosses into a denied <Directory>, does the
# access_checker correctly evaluate the new path?
#
# Also tests: ScriptAlias + PATH_INFO splitting. A request to
# /cgi-bin/test.cgi/admin/secret.html splits into:
#   r->filename = /htdocs/cgi-bin/test.cgi
#   r->path_info = /admin/secret.html
# Directory authz checks r->filename (cgi-bin, allowed).
# CGI receives PATH_TRANSLATED = /htdocs/admin/secret.html (denied).

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost
AllowEncodedSlashes On

ScriptAlias /cgi-bin/ /usr/local/apache2/htdocs/cgi-bin/

# Alias maps /scripts/ to the admin directory (as if it were a script dir)
Alias /scripts /usr/local/apache2/htdocs/admin

<Directory /usr/local/apache2/htdocs>
    Options +ExecCGI +FollowSymLinks
    Require all granted
</Directory>

<Directory /usr/local/apache2/htdocs/admin>
    Require all denied
</Directory>

<Directory /usr/local/apache2/htdocs/internal>
    Require all denied
</Directory>
