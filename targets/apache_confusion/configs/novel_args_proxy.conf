LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ServerName localhost

AllowEncodedSlashes NoDecode

<Location />
    Require all granted
</Location>

# Realistic: API proxy with path rewrite
# /api/v1/users/123 → http://backend:80/users/123
RewriteEngine On
RewriteRule "^/api/v1/(.*)$" "http://backend:80/$1" [P,L]

<Location /health>
    Require all granted
</Location>
<Location /fuzztrace>
    Require all granted
</Location>
