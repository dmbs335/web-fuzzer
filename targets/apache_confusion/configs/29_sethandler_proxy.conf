# Test config: SetHandler proxy: standard pattern
# Goal: verify what path the backend receives

LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ServerName localhost

<Location />
    Require all granted
</Location>

<Location /admin>
    Require all denied
</Location>

# Standard SetHandler proxy pattern (documented by Apache)
<Location /api>
    SetHandler "proxy:http://backend:80/api"
</Location>

# Second variant: SetHandler without path
<Location /backend>
    SetHandler "proxy:http://backend:80"
</Location>

<Location /health>
    Require all granted
</Location>

<Location /fuzztrace>
    Require all granted
</Location>
