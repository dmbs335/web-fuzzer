LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ServerName localhost

# Default: allow all
<Location />
    Require all granted
</Location>

# --- TEST A: ProxyPass with <Proxy> deny ---
# ProxyPass that SHOULD be blocked by <Proxy> deny
ProxyPass /blocked-pp http://backend:80/api

# <Proxy> deny for that specific backend URL
<Proxy http://backend:80/api/*>
    Require all denied
</Proxy>

# --- TEST B: ProxyPass with <Proxy> allow ---
ProxyPass /allowed-pp http://backend:80/public

<Proxy http://backend:80/public/*>
    Require all granted
</Proxy>

# --- TEST C: SetHandler with same <Proxy> deny ---
<Location /blocked-sh>
    SetHandler "proxy:http://backend:80/api"
</Location>

# --- TEST D: SetHandler with <Proxy> allow ---
<Location /allowed-sh>
    SetHandler "proxy:http://backend:80/public"
</Location>

<Location /health>
    Require all granted
</Location>
<Location /fuzztrace>
    Require all granted
</Location>
