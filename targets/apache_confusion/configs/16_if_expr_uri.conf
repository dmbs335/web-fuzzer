# Config 16: <If> expression-based authz + per-dir rewrite — TOCTOU surface
#
# Require expr evaluates %{REQUEST_URI} at access_checker time.
# Per-dir RewriteRule changes r->uri in fixup phase (AFTER access_checker).
# If Require expr caches its evaluation and does NOT re-evaluate after
# fixup rewrite, the expression result is stale → ACL bypass.
#
# This is a DIFFERENT code path from Orange's patches (mod_authz_core.c
# expression evaluation vs mod_rewrite.c filename confusion).

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost
AllowEncodedSlashes On

<Directory /usr/local/apache2/htdocs>
    RewriteEngine On
    # Per-dir rewrite: maps /safe/* → admin/* in FIXUP phase
    RewriteRule ^safe/(.*)$ admin/$1 [L]
    # Also map /app/* → admin/*
    RewriteRule ^app/(.*)$ admin/$1 [L]

    Options +FollowSymLinks
    Require all granted
</Directory>

# Expression-based deny: checks REQUEST_URI at evaluation time
<Directory /usr/local/apache2/htdocs>
    <If "%{REQUEST_URI} =~ m#^/admin/#">
        Require all denied
    </If>
    <If "%{REQUEST_URI} =~ m#^/internal/#">
        Require all denied
    </If>
</Directory>
