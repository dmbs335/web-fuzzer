# Config 04: Proxy passthrough via AJP + Location authz + MergeSlashes off
# Dimensions: rewrite=proxy_passthrough, backend=proxy_ajp, authz=location, path_norm=merge_slashes_off
# Tests: AJP path handling differences, double-slash confusion

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost
MergeSlashes Off

RewriteEngine On
RewriteRule ^/app/(.*)$ ajp://127.0.0.1:8009/$1 [P]

<Location />
    Require all granted
</Location>

<Location /admin>
    Require all denied
</Location>

<Location /internal>
    Require all denied
</Location>

<Location /health>
    Require all granted
</Location>


