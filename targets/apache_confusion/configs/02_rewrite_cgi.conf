# Config 02: Simple rewrite + CGI backend + Directory-based authz
# Dimensions: rewrite=simple, backend=cgi, authz=directory, path_norm=default
# Tests: path_info splitting confusion between rewrite and cgi handler

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost

RewriteEngine On
RewriteRule ^/app/(.*)$ /cgi-bin/test.cgi/$1 [L]

ScriptAlias /cgi-bin/ /usr/local/apache2/htdocs/cgi-bin/

<Directory /usr/local/apache2/htdocs/admin>
    Require all denied
</Directory>

<Directory /usr/local/apache2/htdocs/internal>
    Require all denied
</Directory>

<Directory /usr/local/apache2/htdocs>
    Options +ExecCGI
    Require all granted
</Directory>
