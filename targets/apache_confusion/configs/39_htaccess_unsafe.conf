LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule rewrite_module modules/mod_rewrite.so

ServerName localhost

<Location />
    Require all granted
</Location>

<Location /admin>
    Require all denied
</Location>

# AllowOverride FileInfo — common in shared hosting
<Directory "/usr/local/apache2/htdocs">
    AllowOverride FileInfo
    Require all granted
</Directory>

<Location /health>
    Require all granted
</Location>
<Location /fuzztrace>
    Require all granted
</Location>
