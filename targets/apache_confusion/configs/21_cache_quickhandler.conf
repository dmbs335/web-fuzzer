# Config 21: mod_cache quick_handler — cache bypass authz
#
# mod_cache with CacheQuickHandler On (default) serves cached responses
# BEFORE access_checker runs. If a response is cached from an authorized
# request, subsequent unauthorized requests may receive cached content.
#
# This is a fundamentally different timing — quick_handler runs before
# ALL other hooks, not just before handler.

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost

CacheEnable disk /
CacheRoot /var/cache/apache2/mod_cache_disk
CacheDefaultExpire 60
CacheQuickHandler On

<Location />
    Require all granted
</Location>

<Location /admin>
    Require all denied
</Location>

<Location /internal>
    Require all denied
</Location>
