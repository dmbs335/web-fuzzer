# Config 13: Per-dir rewrite maps into DENIED directory — TOCTOU surface
#
# Attack Surface #4 from Red Team:
# Per-directory RewriteRule runs in FIXUP phase (AFTER access_checker).
# The rewrite substitution targets /admin/ which is denied by <Directory>.
# If Apache does NOT re-run access_checker after the fixup rewrite,
# the ACL bypass is complete.
#
# This is the most promising config for finding a real confusion bug.

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost
AllowEncodedSlashes On

<Directory /usr/local/apache2/htdocs>
    RewriteEngine On
    # Per-dir rewrite: runs in FIXUP phase, AFTER access_check
    # Maps /app/* into the DENIED /admin/ directory
    RewriteRule ^app/(.*)$ admin/$1 [L]

    Options +FollowSymLinks
    Require all granted
</Directory>

<Directory /usr/local/apache2/htdocs/admin>
    Require all denied
</Directory>

<Directory /usr/local/apache2/htdocs/internal>
    Require all denied
</Directory>
