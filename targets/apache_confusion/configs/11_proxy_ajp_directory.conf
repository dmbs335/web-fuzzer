# Config 11: AJP proxy + Directory authz
# Dimensions: rewrite=off, backend=proxy_ajp, authz=directory, path_norm=default
# Tests: AJP backend path interpretation vs directory-based access control

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost

ProxyPass /app ajp://127.0.0.1:8009/
ProxyPassReverse /app ajp://127.0.0.1:8009/

<Directory /usr/local/apache2/htdocs/admin>
    Require all denied
</Directory>

<Directory /usr/local/apache2/htdocs/internal>
    Require all denied
</Directory>

<Directory /usr/local/apache2/htdocs>
    Require all granted
</Directory>
