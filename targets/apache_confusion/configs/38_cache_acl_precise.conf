# Precise cache ACL bypass test
# Allow only ONE specific IP, then test if cache serves to others

LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule cache_module modules/mod_cache.so
LoadModule cache_socache_module modules/mod_cache_socache.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

ServerName localhost

CacheSocache shmcb
CacheEnable socache /
# Explicitly ON for clarity
CacheQuickHandler On

# Cache static content aggressively
<Location />
    Require all granted
</Location>

# Admin: allow ONLY from 172.18.0.1 (the Docker host gateway)
<Location /admin>
    Require ip 172.18.0.1
</Location>

<Location /health>
    Require all granted
</Location>
<Location /fuzztrace>
    Require all granted
</Location>
