LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule cgi_module modules/mod_cgi.so

ServerName localhost

<Location />
    Require all granted
</Location>

RewriteEngine On
# Orange's example: simple suffix rewrite
RewriteRule "^/html/(.*)$" "/$1.html" [L]

# Another variant
RewriteRule "^/files/(.*)$" "/$1" [L]

<Location /health>
    Require all granted
</Location>
<Location /fuzztrace>
    Require all granted
</Location>
