LoadModule fuzztrace_module modules/mod_fuzztrace.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

ServerName localhost

<Location />
    Require all granted
</Location>

# Enable forward proxy
ProxyRequests On

# Deny all forward proxy requests  
<Proxy *>
    Require all denied
</Proxy>

# But allow reverse proxy to backend
ProxyPass /api http://backend:80/api

<Location /health>
    Require all granted
</Location>
<Location /fuzztrace>
    Require all granted
</Location>
