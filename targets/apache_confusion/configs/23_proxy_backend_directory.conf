# Config 23: Reverse proxy to SEPARATE backend + Directory authz
#
# Frontend Apache proxies to a separate backend (port 80 on backend container).
# Frontend has <Directory> deny for /admin.
# Backend has NO access control — serves everything.
#
# This is the real Orange pattern: if r->filename becomes "proxy:http://backend/..."
# then <Directory /htdocs/admin> can't match the proxy URL → ACL bypass → backend serves content.
#
# With separate backend, the proxy actually reaches different content.

LoadModule fuzztrace_module modules/mod_fuzztrace.so

ServerName localhost

RewriteEngine On
# Proxy to separate backend container
RewriteRule ^/proxy/(.*)$ http://backend:80/$1 [P]

# Directory-based authz on FRONTEND
<Directory /usr/local/apache2/htdocs/admin>
    Require all denied
</Directory>

<Directory /usr/local/apache2/htdocs/internal>
    Require all denied
</Directory>

<Directory /usr/local/apache2/htdocs>
    Require all granted
</Directory>
