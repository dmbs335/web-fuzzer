<style>

.test { border: 1px solid #333; padding: 1em; margin: 1em 0; background: #16213e; border-radius: 4px; }
.pass { border-color: #0f0; }
.fail { border-color: #f00; background: #2a1020; }
.warn { border-color: #ff0; background: #2a2010; }
pre { white-space: pre-wrap; word-break: break-all; background: #0a0a1a; padding: 0.5em; border-radius: 4px; }
.label { font-weight: bold; color: #0ff; }
.danger { color: #f44; font-weight: bold; }

<body>

<p>This page tests if DOMPurify-sanitized output becomes dangerous after a browser innerHTML round-trip.</p>
<div id="results"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
<script>
const tests = [

WfEMj81c

  },
  {
    id: "v2_0001",
    name: "v2 0001 - Math xmlns namespace injection with onload",
    session: "mxss_taxonomy_v2",
    input: `<!DOCTYPE HTML PUBLIC "-//W3C//DTDHTML 4.01//EN">

    session: "mxss_taxonomy_v3",
    input: `\\xEF\\xBB\\xBF<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">

const EVENT_RE = /^on[a-z]+$/i;

function findHandlers(el, path) {
  const results = [];
  if (!el || !el.attributes) return results;
  const tag = el.tagName ? el.tagName.toLowerCase() : "?";
  const p = path ? path + " > " + tag : tag;
  for (const attr of el.attributes) {
    if (EVENT_RE.test(attr.name)) {
      results.push({ path: p, attr: attr.name, val: attr.value });
    }
  }
  for (const child of el.children) {
    results.push(...findHandlers(child, p));
  }
  return results;
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

const container = document.getElementById("results");

for (const t of tests) {
  // Step 1: Sanitize
  const sanitized = DOMPurify.sanitize(t.input);

  // Step 2: innerHTML round-trip (real browser parser!)
  const div = document.createElement("div");
  div.innerHTML = sanitized;
  const reparsed = div.innerHTML;

  // Step 3: Check for event handlers in real DOM
  const handlers = findHandlers(div, "");

  // Step 4: Check mutation
  const mutated = sanitized !== reparsed;

  // Step 5: Check for on* patterns in raw text
  const patterns = reparsed.match(/\bon[a-z]+=(?:[^\s>]*)/gi) || [];

  let verdict, cls;
  if (handlers.length > 0) {
    verdict = "EXPLOITABLE - Event handler survived in real browser DOM!";
    cls = "fail";
  } else if (mutated && patterns.length > 0) {
    verdict = "MUTATION DETECTED + event handler pattern in output (potential mXSS)";
    cls = "warn";
  } else if (mutated) {
    verdict = "MUTATION DETECTED but no event handlers found";
    cls = "warn";
  } else if (patterns.length > 0) {
    verdict = "FALSE POSITIVE - Pattern in text/value, not in DOM attributes";
    cls = "pass";
  } else {
    verdict = "FALSE POSITIVE - No event handlers found";
    cls = "pass";
  }

  let html = `<div class="test ${cls}">`;
  html += `<h2>${escHtml(t.name)}</h2>`;
  html += `<p><span class="label">Verdict:</span> <span class="${handlers.length > 0 ? 'danger' : mutated ? 'warning' : 'safe'}">${escHtml(verdict)}</span></p>`;
  html += `<p><span class="label">Mutation:</span> ${mutated ? '<span class="warning">YES</span>' : '<span class="safe">NO</span>'}</p>`;
  html += `<p><span class="label">Event handlers in DOM:</span> ${handlers.length > 0 ? '<span class="danger">' + handlers.length + '</span>' : '<span class="safe">0</span>'}</p>`;

  if (handlers.length > 0) {
    html += `<p class="danger">Handlers found:</p><pre>`;
    for (const h of handlers) html += `${escHtml(h.path)} [${escHtml(h.attr)}]="${escHtml(h.val)}"\n`;
    html += `</pre>`;
  }

  html += `<details><summary>DOMPurify Output</summary><pre>${escHtml(sanitized)}</pre></details>`;
  html += `<details><summary>Browser Re-parsed</summary><pre>${escHtml(reparsed)}</pre></details>`;

  if (mutated) {
    html += `<details open><summary>Diff (sanitized vs reparsed)</summary><pre>`;
    const sLines = sanitized.split("\n");
    const rLines = reparsed.split("\n");
    const maxLen = Math.max(sLines.length, rLines.length);
    for (let i = 0; i < maxLen; i++) {
      if (sLines[i] !== rLines[i]) {
        html += `<span class="danger">- ${escHtml(sLines[i] || "(empty)")}\n+ ${escHtml(rLines[i] || "(empty)")}</span>\n`;
      }
    }
    html += `</pre></details>`;
  }

  html += `</div>`;
  container.innerHTML += html;
}
</script>
