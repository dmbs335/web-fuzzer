worker_processes auto;

load_module /nginx/modules/ngx_http_naxsi_module.so;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nodelay on;
    keepalive_timeout 65;

    access_log /nginx/logs/access.log;
    error_log  /nginx/logs/error.log warn;

    # NAXSI core rules (SQLi, XSS, RFI, traversal, evasion, upload)
    include /nginx/naxsi/naxsi_core.rules;

    # Extended blocking rules
    include /nginx/naxsi/blocking/*;

    upstream backend {
        server waf_backend:8081;
    }

    server {
        listen 8080;
        server_name _;

        location / {
            # NAXSI blocking mode
            SecRulesEnabled;
            LibInjectionSql;
            LibInjectionXss;

            DeniedUrl "/NaxsiRequestDenied";

            CheckRule "$SQL >= 8" BLOCK;
            CheckRule "$RFI >= 8" BLOCK;
            CheckRule "$TRAVERSAL >= 5" BLOCK;
            CheckRule "$UPLOAD >= 5" BLOCK;
            CheckRule "$XSS >= 8" BLOCK;
            CheckRule "$UWA >= 8" BLOCK;
            CheckRule "$EVADE >= 8" BLOCK;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /NaxsiRequestDenied {
            internal;
            return 403 "Blocked by NAXSI";
        }

        location /health {
            access_log off;
            return 200 "ok";
        }
    }
}
