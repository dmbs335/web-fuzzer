global
    log stdout format raw local0

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    log global

frontend web
    bind *:80

    # Static files → static backend
    acl is_static path_end .jpg .png .css .js .gif
    use_backend static_be if is_static

    # Admin → deny
    acl is_admin path_beg /admin
    http-request deny if is_admin

    # Everything else → app backend
    default_backend app_be

backend static_be
    server static1 backend:80

backend app_be
    server app1 backend:80
